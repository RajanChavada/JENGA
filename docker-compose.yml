# Optional. The app defaults to JENGA_STORAGE=memory and needs none of this.
# Only bring this up if you want the Postgres/pgvector path for the demo.
#   docker compose up -d
#   export JENGA_STORAGE=postgres
#   export DATABASE_URL=postgresql+asyncpg://jenga:jenga@localhost:5433/jenga

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: jenga
      POSTGRES_PASSWORD: jenga
      POSTGRES_DB: jenga
    ports:
      - "5433:5432"
    volumes:
      - jenga_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jenga"]
      interval: 5s
      retries: 10

volumes:
  jenga_pg:
